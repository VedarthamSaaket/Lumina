version: '3.9'

# Production deploys MUST override POSTGRES_PASSWORD and SECRET_KEY via .env
# (docker-compose reads .env automatically). The defaults below are dev-only.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-lumina_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumina_pass}
      POSTGRES_DB:       ${POSTGRES_DB:-lumina_db}
    # Bind Postgres to loopback only — backend container reaches it over the
    # internal compose network, the host port is for local dev tooling.
    # In production set POSTGRES_HOST_BIND= (empty) to disable the host port entirely.
    ports:
      - "${POSTGRES_HOST_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumina_user} -d ${POSTGRES_DB:-lumina_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL:                postgresql://${POSTGRES_USER:-lumina_user}:${POSTGRES_PASSWORD:-lumina_pass}@postgres:5432/${POSTGRES_DB:-lumina_db}
      FRONTEND_URL:                ${FRONTEND_URL:-http://localhost:3000}
      SECRET_KEY:                  ${SECRET_KEY}
      ENFORCE_HTTPS:               ${ENFORCE_HTTPS:-false}
      ENVIRONMENT:                 ${ENVIRONMENT:-development}
      GROQ_API_KEY:                ${GROQ_API_KEY}
      HF_API_KEY:                  ${HF_API_KEY}
      OLLAMA_BASE_URL:             http://host.docker.internal:11434
      SPECIALTY_REGISTRY_SECRET:   ${SPECIALTY_REGISTRY_SECRET}
      KAGGLE_USERNAME:             ${KAGGLE_USERNAME}
      KAGGLE_KEY:                  ${KAGGLE_KEY}
      KAGGLE_KERNEL_SLUG:          ${KAGGLE_KERNEL_SLUG}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  pgdata:
